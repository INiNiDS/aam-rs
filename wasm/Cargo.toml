[package]
name = "aam-wasm"
description = "Wasm bindings for the AAM framework implemented in Rust."
repository = "https://github.com/ininids/aam-rs/tree/main/wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aam-rs = { path = ".." }
wasm-bindgen = "0.2.105"

[dev-dependencies]
wasm-bindgen-test = "0.3.55"

