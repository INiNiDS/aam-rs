name: Rust-only Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  validate:
    name: Tests, Formatting & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: |
          cargo test --all-targets
          cargo test --all-targets --features serde
          cargo test --all-targets --features aot
      - name: Security audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  release-plz:
    needs:
      - validate
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.extract_tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      - name: Extract created release tag
        id: extract_tag
        shell: bash
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.releases_created }}
          RELEASES_JSON: ${{ steps.release.outputs.releases }}
        run: |
          if [[ "$RELEASE_CREATED" != "true" ]]; then
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(echo "$RELEASES_JSON" | jq -r '.[0].tag // empty')
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
