name: Manual Build & Attach C Libs

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Force build and attach C libraries to latest release'

permissions:
  contents: write
  packages: write

jobs:
  get-latest-tag:
    name: Find Latest Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch Latest Release Tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "Error: No releases found in the repository. Please create a release first." >&2
            exit 1
          fi
          
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Found actual tag: $LATEST_TAG"

  build-c-libs:
    name: Build & Upload C Libs
    needs: get-latest-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aam-c-linux-x86_64
            lib_name: aam-c.so
          - os: macos-latest
            artifact_name: aam-c-macos-x86_64
            lib_name: aam-c.dylib
          - os: windows-latest
            artifact_name: aam-c-windows-x86_64
            lib_name: aam-c.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cbindgen
        run: cargo binstall cbindgen -y

      - name: Build release library
        run: cargo build --release

      - name: Prepare C/C++ Package Structure
        run: |
          mkdir -p package/include package/lib/cmake/aam-c package/bin package/examples
          
          cbindgen --config cbindgen.toml --crate aam-rs --output package/include/aam-c.h
          
          cp LICENSE package/ 2>/dev/null || true
          cp examples/c/*.c package/examples/ 2>/dev/null || true
          cp examples/c/*.aam package/examples/ 2>/dev/null || true
          cp examples/c/Makefile package/examples/ 2>/dev/null || true
          cp examples/c/CMakeLists.txt package/examples/ 2>/dev/null || true
          
          cp aam-cConfig.cmake package/lib/cmake/aam-c/ 2>/dev/null || true
          
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/release/aam_rs.dll package/bin/aam_c.dll
            cp target/release/aam_rs.dll.lib package/lib/aam_c.lib
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp target/release/libaam_rs.dylib package/lib/libaam_c.dylib
          else
            cp target/release/libaam_rs.so package/lib/libaam_c.so
          fi

      - name: Zip Package
        run: |
          cd package
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ../${{ matrix.artifact_name }}.zip *
          else
            zip -r ../${{ matrix.artifact_name }}.zip ./*
          fi

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-latest-tag.outputs.tag_name }}
          files: ${{ matrix.artifact_name }}.zip

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
          manylinux: auto
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
          manylinux: musllinux_1_2
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: false
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14t
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  upload-wheels-to-release:
    name: Upload Python Wheels to Release
    needs: [ get-latest-tag, linux, musllinux, windows, macos, sdist ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Upload Wheels and sdist to Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-latest-tag.outputs.tag_name }}
          files: dist/*

  build-jni-libs:
    name: Build JNI Native Libraries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jni-linux-x86_64
            file: libaam_rs.so
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: jni-macos-x86_64
            file: libaam_rs.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jni-macos-aarch64
            file: libaam_rs.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jni-windows-x86_64
            file: aam_rs.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build JNI release library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload JNI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
          retention-days: 1

  build-go-libs:
    name: Build & Test Go Bindings
    needs: get-latest-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aam-go-linux-x86_64
            static_lib: libaam_rs.a
            shared_lib: libaam_rs.so
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: aam-go-macos-x86_64
            static_lib: libaam_rs.a
            shared_lib: libaam_rs.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: aam-go-macos-aarch64
            static_lib: libaam_rs.a
            shared_lib: libaam_rs.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aam-go-windows-x86_64
            static_lib: aam_rs.lib
            shared_lib: aam_rs.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust library with FFI (static + dynamic)
        run: cargo build --release --features ffi --target ${{ matrix.target }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.sum

      - name: Test Go bindings (Linux / macOS only)
        if: runner.os != 'Windows'
        working-directory: ./go
        env:
          CGO_CFLAGS: "-I${{ github.workspace }}/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/${{ matrix.target }}/release -laam_rs -ldl -lpthread -lm"
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/target/${{ matrix.target }}/release:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="${{ github.workspace }}/target/${{ matrix.target }}/release:$DYLD_LIBRARY_PATH"
          go test -v ./...

      - name: Package Go bindings
        run: |
          mkdir -p go-pkg/lib go-pkg/include go-pkg/src
          cp include/aam.h go-pkg/include/
          cp -r go/ go-pkg/src/
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/aam_rs.dll     go-pkg/lib/ 2>/dev/null || true
            cp target/${{ matrix.target }}/release/aam_rs.dll.lib go-pkg/lib/aam_rs.lib 2>/dev/null || true
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp target/${{ matrix.target }}/release/libaam_rs.a     go-pkg/lib/ 2>/dev/null || true
            cp target/${{ matrix.target }}/release/libaam_rs.dylib go-pkg/lib/ 2>/dev/null || true
          else
            cp target/${{ matrix.target }}/release/libaam_rs.a  go-pkg/lib/ 2>/dev/null || true
            cp target/${{ matrix.target }}/release/libaam_rs.so go-pkg/lib/ 2>/dev/null || true
          fi
          cd go-pkg && zip -r ../${{ matrix.artifact }}.zip ./*

      - name: Upload Go package to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-latest-tag.outputs.tag_name }}
          files: ${{ matrix.artifact }}.zip

  publish-java:
    name: Publish Fat JAR & Upload to Release
    needs: [ get-latest-tag, build-jni-libs ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: actions/download-artifact@v8
        with:
          name: jni-linux-x86_64
          path: java/src/main/resources/natives/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: jni-macos-x86_64
          path: java/src/main/resources/natives/macos-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: jni-macos-aarch64
          path: java/src/main/resources/natives/macos-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: jni-windows-x86_64
          path: java/src/main/resources/natives/windows-x86_64

      - name: Build and Publish locally
        working-directory: ./java
        run: ./gradlew build publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create Zip Bundle for Central Portal
        working-directory: ./java
        run: |
          cd build/staging-repo 
          zip -r ../bundle.zip .

      - name: Upload Bundle to Maven Central
        working-directory: ./java
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          echo "Uploading bundle to Maven Central Portal..."
          curl --request POST \
            --url 'https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC' \
            -u "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" \
            --header 'Accept: application/json' \
            --form bundle=@build/bundle.zip \
            --fail # Чтобы Action падал, если curl вернет ошибку (например, 401 Unauthorized)

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-latest-tag.outputs.tag_name }}
          files: java/build/libs/*.jar