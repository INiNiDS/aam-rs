
stages:
  - validate
  - test-bindings
  - release
  - prepare
  - build
  - upload-release
  - publish

variables:
  RUST_VERSION: "stable"
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTFLAGS: "-D warnings"

cache:
  key: ${CI_COMMIT_REF_SLUG}-${RUST_VERSION}
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

.common_rust_install: &common_rust_install
  before_script:
    - rustup default ${RUST_VERSION}
    - rustup component add rustfmt clippy 2>/dev/null || true

.install_binstall: &install_binstall
  - cargo install cargo-binstall --locked 2>/dev/null || true

fmt-check:
  stage: validate
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: validate
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --all-features -- -D warnings

test-core:
  stage: validate
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cargo test --all-targets
    - cargo test --all-targets --features serde
    - cargo test --all-targets --features aot

test-msrv:
  stage: validate
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cargo install cargo-msrv --locked
    - cargo msrv verify -- cargo check --all-targets
  allow_failure: true

security-audit:
  stage: validate
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cargo install cargo-deny --locked
    - cargo deny check bans licenses
  allow_failure: true

test-go-bindings:
  stage: test-bindings
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    LD_LIBRARY_PATH: ${CI_PROJECT_DIR}/target/release
  script:
    - apt-get update && apt-get install -y golang-go
    - cargo build --release --features ffi
    - cd bindings/go && go test -v ./...

test-csharp-bindings:
  stage: test-bindings
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    LD_LIBRARY_PATH: ${CI_PROJECT_DIR}/target/release
  script:
    - apt-get update && apt-get install -y dotnet-sdk-10.0
    - cargo build --release --features ffi,csharp
    - cd bindings/csharp
    - dotnet restore AamCsharp.sln
    - dotnet build AamCsharp.sln --configuration Release --no-restore
    - dotnet test AamCsharp.sln --configuration Release --no-build -v normal

test-php-bindings:
  stage: test-bindings
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    AAM_RS_LIB: ${CI_PROJECT_DIR}/target/release/libaam_rs.so
  script:
    - apt-get update && apt-get install -y php php-ffi
    - cargo build --release --features ffi
    - php bindings/php/tests/smoke.php

test-ruby-bindings:
  stage: test-bindings
  image: ruby:3.3
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt-get update && apt-get install -y curl build-essential
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo build --manifest-path bindings/ruby/ext/aam_rs/Cargo.toml --release
    - cp bindings/ruby/ext/aam_rs/target/release/libaam_ruby.so bindings/ruby/ext/aam_rs/target/release/aam_ruby.so 2>/dev/null || true
    - ruby bindings/ruby/tests/test_aam_rs.rb

test-js-bindings:
  stage: test-bindings
  image: node:24
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt-get update && apt-get install -y curl build-essential
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cd bindings/js && npm install && npm test

test-wasm-bindings:
  stage: test-bindings
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt-get update && apt-get install -y npm
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-pack --locked
    - cd bindings/wasm && cargo test && wasm-pack test --node

# ============================================================================
# STAGE: release (только main) — GitLab-нативный release-plz
# ============================================================================
release-plz:
  stage: release
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - fmt-check
    - clippy
    - test-core
    - test-msrv
    - security-audit
    - test-go-bindings
    - test-csharp-bindings
    - test-php-bindings
    - test-ruby-bindings
    - test-js-bindings
    - test-wasm-bindings
  script:
    - apt-get update && apt-get install -y git
    - git config user.email "gitlab-ci@example.com"
    - git config user.name "GitLab CI"
    - *install_binstall
    - cargo binstall release-plz -y
    - release-plz release --forge gitlab --git-token "${GITLAB_TOKEN}" --cargo-token "${CARGO_REGISTRY_TOKEN}" --verbose
  environment:
    name: release-plz

credits:
  stage: prepare
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - *install_binstall
    - cargo binstall cargo-about -y
    - cargo about generate about.hbs > CREDITS.html
    - cp LICENSE-MIT LICENSE-APACHE .
  artifacts:
    paths:
      - CREDITS.html
      - LICENSE-MIT
      - LICENSE-APACHE
    expire_in: 1 day


# ─── C Library ───────────────────────────────────────────────────────
.c_build_setup: &c_build_setup
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]

build-c-libs:linux:
  <<: *c_build_setup
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y zip
    - rustup default stable
    - cargo install cargo-binstall --locked
    - cargo binstall cbindgen -y
    - cargo build --release
    - mkdir -p dist-c
  script:
    - cp target/release/libaam_rs.so libaam-c.so
    - cbindgen --config cbindgen.toml --output aam-c.h
    - cp LICENSE-MIT LICENSE-APACHE CREDITS.html .
    - zip aam-c-linux-x86_64.zip libaam-c.so aam-c.h LICENSE-MIT LICENSE-APACHE CREDITS.html
    - mv aam-c-linux-x86_64.zip dist-c/
  artifacts:
    paths:
      - dist-c/aam-c-linux-x86_64.zip

build-c-libs:macos:
  <<: *c_build_setup
  tags:
    - saas-macos-medium
  before_script:
    - brew install zip
    - rustup default stable
    - cargo install cargo-binstall --locked
    - cargo binstall cbindgen -y
    - cargo build --release
    - mkdir -p dist-c
  script:
    - cp target/release/libaam_rs.dylib libaam-c.dylib
    - cbindgen --config cbindgen.toml --output aam-c.h
    - cp LICENSE-MIT LICENSE-APACHE CREDITS.html .
    - zip aam-c-macos-x86_64.zip libaam-c.dylib aam-c.h LICENSE-MIT LICENSE-APACHE CREDITS.html
    - mv aam-c-macos-x86_64.zip dist-c/
  artifacts:
    paths:
      - dist-c/aam-c-macos-x86_64.zip

build-c-libs:windows:
  <<: *c_build_setup
  tags:
    - saas-windows-medium
  before_script:
    - rustup default stable
    - cargo install cargo-binstall --locked
    - cargo binstall cbindgen -y
    - cargo build --release
    - if not exist dist-c mkdir dist-c
  script:
    - copy target\release\aam_rs.dll aam-c.dll
    - copy target\release\aam_rs.dll.lib aam-c.lib 2>NUL || (echo. > aam-c.lib)
    - cbindgen --config cbindgen.toml --output aam-c.h
    - copy LICENSE-MIT+LICENSE-APACHE+CREDITS.html . >NUL
    - Compress-Archive -Path aam-c.dll,aam-c.lib,aam-c.h,LICENSE-MIT,LICENSE-APACHE,CREDITS.html -DestinationPath aam-c-windows-x86_64.zip
    - move aam-c-windows-x86_64.zip dist-c\
  artifacts:
    paths:
      - dist-c/aam-c-windows-x86_64.zip

# ─── Node.js Addon ───────────────────────────────────────────────────
.build-node: &build_node
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - cd bindings/js
    - npm install
    - npm run build
    - mkdir -p ${CI_PROJECT_DIR}/dist-node
    - cp aam_rs_node.* ${CI_PROJECT_DIR}/dist-node/

build-node-linux-x64:
  <<: *build_node
  image: node:24
  before_script:
    - apt-get update && apt-get install -y curl build-essential
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup default stable
  artifacts:
    paths:
      - dist-node/aam_rs_node.linux-x64-gnu.node

build-node-darwin-x64:
  <<: *build_node
  tags: [saas-macos-medium]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup default stable
  artifacts:
    paths:
      - dist-node/aam_rs_node.darwin-x64.node

build-node-darwin-arm64:
  <<: *build_node
  tags: [saas-macos-medium]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup default stable
  artifacts:
    paths:
      - dist-node/aam_rs_node.darwin-arm64.node

build-node-win32-x64:
  <<: *build_node
  tags: [saas-windows-medium]
  before_script:
    - Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path += ";$env:USERPROFILE\.cargo\bin"
  artifacts:
    paths:
      - dist-node/aam_rs_node.win32-x64-msvc.node

# ─── WASM ────────────────────────────────────────────────────────────
build-wasm:
  stage: build
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-pack --locked
    - cd bindings/wasm
    - wasm-pack build --release --target nodejs --out-dir pkg
    - cargo test
    - wasm-pack test --node
    - mkdir -p ../../dist-wasm
    - cp -r pkg ../../dist-wasm/
  artifacts:
    paths:
      - dist-wasm/

# ─── Ruby Gem ────────────────────────────────────────────────────────
build-ruby:
  stage: build
  image: ruby:3.3
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - apt-get update && apt-get install -y curl build-essential
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup default stable
    - cargo build --manifest-path bindings/ruby/ext/aam_rs/Cargo.toml --release
    - cp bindings/ruby/ext/aam_rs/target/release/libaam_ruby.so bindings/ruby/lib/aam_ruby.so 2>/dev/null || true
    - cp bindings/ruby/ext/aam_rs/target/release/libaam_rs_ruby.so bindings/ruby/lib/aam_rs_ruby.so 2>/dev/null || true
    - sed -i 's/libaam_ruby/aam_ruby/g; s/libaam_rs_ruby/aam_rs_ruby/g' bindings/ruby/lib/aam_rb.rb
    - cd bindings/ruby && gem build aam-ruby.gemspec --output ../../aam-ruby.gem
    - mkdir -p ../../dist-ruby
    - cp ../../aam-ruby.gem ../../dist-ruby/
  artifacts:
    paths:
      - dist-ruby/aam-ruby.gem

# ─── PHP ─────────────────────────────────────────────────────────────
build-php:
  stage: build
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - apt-get update && apt-get install -y php php-ffi zip
    - cargo build --release --features ffi
    - mkdir -p php-pkg/src php-pkg/tests php-pkg/native
    - cp bindings/php/src/AamPhp.php php-pkg/src/
    - cp bindings/php/tests/smoke.php php-pkg/tests/
    - cp bindings/php/README.md php-pkg/ 2>/dev/null || true
    - cp bindings/php/composer.json php-pkg/ 2>/dev/null || true
    - cp target/release/libaam_rs.so php-pkg/native/
    - cp LICENSE-MIT LICENSE-APACHE CREDITS.html php-pkg/
    - cd php-pkg && zip -r ../aam-php-package.zip ./*
    - mkdir -p ../dist-php && mv ../aam-php-package.zip ../dist-php/
  artifacts:
    paths:
      - dist-php/aam-php-package.zip

# ─── C# ──────────────────────────────────────────────────────────────
build-csharp-linux:
  stage: build
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - apt-get update && apt-get install -y dotnet-sdk-10.0
    - cargo build --release --features ffi,csharp
    - cp target/release/libaam_rs.so bindings/csharp/runtimes/linux-x64/native/
    - mkdir -p dist-csharp
    - cp -r bindings/csharp/runtimes dist-csharp/
  artifacts:
    paths:
      - dist-csharp/

# ─── Go ──────────────────────────────────────────────────────────────
build-go-linux:
  stage: build
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - apt-get update && apt-get install -y golang-go zip
    - cargo build --release --features ffi
    - mkdir -p go-pkg/lib go-pkg/include go-pkg/src
    - cp bindings/c/include/aam.h go-pkg/include/
    - cp -r bindings/go/ go-pkg/src/
    - cp target/release/libaam_rs.a go-pkg/lib/ 2>/dev/null || true
    - cp target/release/libaam_rs.so go-pkg/lib/ 2>/dev/null || true
    - cp LICENSE-MIT LICENSE-APACHE CREDITS.html go-pkg/
    - cd go-pkg && zip -r ../aam-go-linux-x86_64.zip ./*
    - mkdir -p ../dist-go && mv ../aam-go-linux-x86_64.zip ../dist-go/
  artifacts:
    paths:
      - dist-go/aam-go-linux-x86_64.zip

# ─── JNI ─────────────────────────────────────────────────────────────
build-jni-linux:
  stage: build
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - apt-get update && apt-get install -y openjdk-17-jdk gradle
    - cargo build --release
    - mkdir -p bindings/java/src/main/resources/natives/linux-x86_64
    - cp target/release/libaam_rs.so bindings/java/src/main/resources/natives/linux-x86_64/
    - mkdir -p dist-jni
    - cp bindings/java/src/main/resources/natives/linux-x86_64/* dist-jni/
  artifacts:
    paths:
      - dist-jni/

# ─── Python Wheels ───────────────────────────────────────────────────
.linux_wheels: &linux_wheels
  stage: build
  image: quay.io/pypa/manylinux_2_28_x86_64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  variables:
    RUST_VERSION: "stable"
  script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$HOME/.cargo/bin:$PATH"
    - pip install maturin
    - cd bindings/python && maturin build --release --out ../../dist
    - mkdir -p ../../dist-python
    - cp -r ../../dist ../../dist-python/
  artifacts:
    paths:
      - dist-python/

build-python-wheels-linux-x64:
  <<: *linux_wheels
  parallel:
    matrix:
      - TARGET: [x86_64, i686]
        MANYLINUX: [manylinux, musllinux]
  before_script:
    - yum install -y zip

build-python-wheels-macos:
  stage: build
  tags: [saas-macos-medium]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - brew install python@3.13
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup default stable
    - pip3 install maturin
    - cd bindings/python && maturin build --release --out ../../dist
    - mkdir -p ../../dist-python && cp -r ../../dist ../../dist-python/
  artifacts:
    paths:
      - dist-python/

build-python-wheels-windows:
  stage: build
  tags: [saas-windows-medium]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path += ";$env:USERPROFILE\.cargo\bin"
    - pip install maturin
    - cd bindings\python && maturin build --release --out ..\..\dist
    - mkdir ..\..\dist-python && xcopy ..\..\dist ..\..\dist-python\ /E /I
  artifacts:
    paths:
      - dist-python/

build-python-sdist:
  stage: build
  image: python:3.13
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["credits"]
  script:
    - pip install maturin
    - cd bindings/python && maturin sdist --out ../../dist
    - mkdir -p ../../dist-python && cp -r ../../dist ../../dist-python/
  artifacts:
    paths:
      - dist-python/

upload-release:
  stage: upload-release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - build-c-libs:linux
    - build-c-libs:macos
    - build-c-libs:windows
    - build-node-linux-x64
    - build-node-darwin-x64
    - build-node-darwin-arm64
    - build-node-win32-x64
    - build-wasm
    - build-ruby
    - build-php
    - build-csharp-linux
    - build-go-linux
    - build-jni-linux
    - build-python-wheels-linux-x64
    - build-python-wheels-macos
    - build-python-wheels-windows
    - build-python-sdist
  script:
    - echo "Creating GitLab Release with assets"
  release:
    name: '$CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG (автоматически собранные артефакты)'
    assets:
      links:
        - name: 'C library – Linux x86_64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-c/aam-c-linux-x86_64.zip?job=build-c-libs:linux'
        - name: 'C library – macOS x86_64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-c/aam-c-macos-x86_64.zip?job=build-c-libs:macos'
        - name: 'C library – Windows x86_64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-c/aam-c-windows-x86_64.zip?job=build-c-libs:windows'
        - name: 'Node.js Linux'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-node/aam_rs_node.linux-x64-gnu.node?job=build-node-linux-x64'
        - name: 'Node.js macOS Intel'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-node/aam_rs_node.darwin-x64.node?job=build-node-darwin-x64'
        - name: 'Node.js macOS ARM'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-node/aam_rs_node.darwin-arm64.node?job=build-node-darwin-arm64'
        - name: 'Node.js Windows'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-node/aam_rs_node.win32-x64-msvc.node?job=build-node-win32-x64'
        - name: 'WASM package'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-wasm/pkg?job=build-wasm'
        - name: 'Ruby gem'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-ruby/aam-ruby.gem?job=build-ruby'
        - name: 'PHP package'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-php/aam-php-package.zip?job=build-php'
        - name: 'C# runtimes'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-csharp/runtimes?job=build-csharp-linux'
        - name: 'Go package'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-go/aam-go-linux-x86_64.zip?job=build-go-linux'
        - name: 'JNI library'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-jni?job=build-jni-linux'
        - name: 'Python wheels (Linux manylinux)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-python?job=build-python-wheels-linux-x64'
        - name: 'Python wheels (macOS)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-python?job=build-python-wheels-macos'
        - name: 'Python wheels (Windows)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-python?job=build-python-wheels-windows'
        - name: 'Python sdist'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/$CI_JOB_ID/raw/dist-python?job=build-python-sdist'
  environment:
    name: release

publish-crates-io:
  stage: publish
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - cargo publish --token "${CARGO_REGISTRY_TOKEN}" --no-verify
  when: manual

publish-npm:
  stage: publish
  image: node:24
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-node-linux-x64", "build-node-darwin-x64", "build-node-darwin-arm64", "build-node-win32-x64", "credits"]
  before_script:
    - cd bindings/js
    - npm install
  script:
    - cp ${CI_PROJECT_DIR}/dist-node/aam_rs_node.linux-x64-gnu.node npm/linux-x64-gnu/
    - cp ${CI_PROJECT_DIR}/dist-node/aam_rs_node.darwin-x64.node npm/darwin-x64/
    - cp ${CI_PROJECT_DIR}/dist-node/aam_rs_node.darwin-arm64.node npm/darwin-arm64/
    - cp ${CI_PROJECT_DIR}/dist-node/aam_rs_node.win32-x64-msvc.node npm/win32-x64-msvc/
    - export VERSION="${CI_COMMIT_TAG#v}"
    - node -e "const fs=require('fs'); ['package.json','npm/linux-x64-gnu/package.json','npm/darwin-x64/package.json','npm/darwin-arm64/package.json','npm/win32-x64-msvc/package.json'].forEach(p=>{const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version='$VERSION'; if(j.optionalDependencies) for(let k in j.optionalDependencies) j.optionalDependencies[k]='$VERSION'; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')})"
    - npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
    - npm publish ./npm/linux-x64-gnu --access public
    - npm publish ./npm/darwin-x64 --access public
    - npm publish ./npm/darwin-arm64 --access public
    - npm publish ./npm/win32-x64-msvc --access public
    - npm publish --access public

publish-pypi:
  stage: publish
  image: python:3.13
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-python-wheels-linux-x64", "build-python-wheels-macos", "build-python-wheels-windows", "build-python-sdist"]
  script:
    - pip install twine
    - mkdir -p dist && cp ${CI_PROJECT_DIR}/dist-python/dist/* dist/
    - twine upload dist/* -u __token__ -p "${PYPI_API_TOKEN}"

publish-rubygems:
  stage: publish
  image: ruby:3.3
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-ruby"]
  script:
    - mkdir -p ~/.gem
    - 'echo "---" > ~/.gem/credentials'
    - 'echo ":rubygems_api_key: ${RUBY_GEMS_TOKEN}" >> ~/.gem/credentials'
    - chmod 600 ~/.gem/credentials
    - gem push "${CI_PROJECT_DIR}/dist-ruby/aam-ruby.gem"

publish-maven:
  stage: publish
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-jni-linux"]
  script:
    - apt-get update && apt-get install -y openjdk-17-jdk gradle
    - cd bindings/java
    - export VERSION="${CI_COMMIT_TAG#v}"
    - sed -i "s/^version = \".*\"/version = \"$VERSION\"/" build.gradle.kts
    - ./gradlew build publish
  environment:
    name: maven-central

publish-nuget:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-csharp-linux"]
  script:
    - cd bindings/csharp
    - export VERSION="${CI_COMMIT_TAG#v}"
    - dotnet pack AamCsharp.sln -c Release -p:Version=${VERSION} -o artifacts
    - dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}" --skip-duplicate

publish-php-gitlab:
  stage: publish
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-php"]
  before_script:
    - apk add --no-cache git unzip
  script:
    - unzip ${CI_PROJECT_DIR}/dist-php/aam-php-package.zip -d php-repo
    - cd php-repo
    - git init && git checkout -b main
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git add .
    - git commit -m "Release ${CI_COMMIT_TAG}"
    - git tag "${CI_COMMIT_TAG}"
    - git remote add origin "https://gitlab-ci-token:${PHP_MIRROR_TOKEN}@${CI_SERVER_HOST}/aam-rs/aam-php.git"
    - git push origin main --force
    - git push origin --tags
  environment:
    name: php-mirror-gitlab

publish-wasm-npm:
  stage: publish
  image: node:24
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: ["build-wasm"]
  before_script:
    - cd ${CI_PROJECT_DIR}/dist-wasm/pkg
    - npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
  script:
    - npm publish --access public